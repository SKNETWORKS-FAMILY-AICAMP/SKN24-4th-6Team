{% load static %}
<div class="modal-overlay" id="loginModal">
  <div class="modal-card">
    <img src="{% static 'img/main_img.svg' %}" alt="아이고 청년" class="modal-logo">

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">이메일</label>
        <input type="email" id="loginEmail" placeholder="이메일 입력">
        <p id="loginEmailErr" class="error"></p>
      </div>
      <div class="field">
        <label for="loginPw">비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호 입력">
        <p id="loginPwErr" class="error"></p>
        <a href="#" class="pw-find" onclick="closeModal('loginModal'); openModal('resetModal'); return false;">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-primary">로그인</button>
    </form>

    <button class="btn-outline" onclick="closeModal('loginModal'); openModal('termsModal')">회원가입</button>
  </div>
</div>
