<div class="modal-overlay" id="resetModal">
  <div class="modal-card">
    <h2 class="modal-title-left">비밀번호 재설정</h2>

    <!-- 이메일 -->
    <div class="field">
      <label for="resetEmail">이메일</label>
      <div class="field-row">
        <input type="email" id="resetEmail" placeholder="가입 시 사용한 이메일">
        <button type="button" class="btn-sm-primary" id="resetSendBtn" onclick="resetSendCode()">메일 발송</button>
      </div>
      <p id="resetEmailErr" class="error"></p>
    </div>

    <!-- 인증코드 -->
    <div class="field">
      <label for="resetCode">인증코드</label>
      <div class="field-row">
        <div class="code-input-wrap">
          <input type="text" id="resetCode" placeholder="코드 입력" maxlength="6" disabled>
          <span id="resetTimer" class="timer timer-inline"></span>
        </div>
        <button type="button" class="btn-sm-primary" id="resetVerifyBtn" onclick="resetVerifyCode()" disabled>코드 인증</button>
      </div>
      <p id="resetCodeErr" class="error"></p>
    </div>

    <!-- 새 비밀번호 -->
    <div class="field">
      <label for="resetPw">새 비밀번호</label>
      <input type="password" id="resetPw" placeholder="영문, 숫자, 특수문자 중 2종 이상 포함 8~16자" disabled>
      <p id="resetPwErr" class="error"></p>
    </div>

    <!-- 비밀번호 확인 -->
    <div class="field">
      <label for="resetPw2">비밀번호 확인</label>
      <input type="password" id="resetPw2" placeholder="영문, 숫자, 특수문자 중 2종 이상 포함 8~16자" disabled>
      <p id="resetPw2Err" class="error"></p>
    </div>

    <div style="display:flex; gap:8px; margin-top:8px;">
      <button type="button" class="btn-primary" id="resetBtn" onclick="resetPw()" disabled style="flex:1; margin-top:0;">비밀번호 변경</button>
      <button type="button" class="btn-outline" onclick="closeModal('resetModal'); openModal('loginModal')" style="flex:1; margin-top:0;">취소</button>
    </div>
  </div>
</div>
