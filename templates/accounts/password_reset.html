{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이고청년 - 비밀번호 재설정</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h2>비밀번호 재설정</h2>

    <!-- 이메일 -->
    <div class="field">
      <label>이메일</label>
      <div class="field-row">
        <input type="email" id="email" placeholder="예) abc@email.com">
        <button type="button" class="btn-sm" id="sendBtn" onclick="sendCode()">메일 발송</button>
      </div>
      <p id="emailErr" class="error"></p>
    </div>

    <!-- 인증코드 -->
    <div class="field">
      <label>인증코드</label>
      <div class="field-row">
        <input type="text" id="code" placeholder="코드 입력" maxlength="6" disabled>
        <span id="timer" class="timer"></span>
        <button type="button" class="btn-sm" id="verifyBtn" onclick="verifyCode()" disabled>코드 인증</button>
      </div>
      <p id="codeErr" class="error"></p>
    </div>

    <!-- 새 비밀번호 -->
    <div class="field">
      <label>새 비밀번호</label>
      <input type="password" id="pw" placeholder="영문, 숫자, 특수문자 중 2종 이상 포함 8~16자" disabled>
      <p id="pwErr" class="error"></p>
    </div>

    <!-- 비밀번호 확인 -->
    <div class="field">
      <label>비밀번호 확인</label>
      <input type="password" id="pw2" placeholder="영문, 숫자, 특수문자 중 2종 이상 포함 8~16자" disabled>
      <p id="pw2Err" class="error"></p>
    </div>

    <div style="display:flex; gap:8px; margin-top:8px">
      <button type="button" class="btn-primary" id="resetBtn" onclick="resetPw()" disabled style="flex:1; margin-top:0">비밀번호 변경</button>
      <button type="button" class="btn-outline" onclick="location.href='/login/'" style="flex:1; margin-top:0">취소</button>
    </div>
  </div>
</div>

<script>
  function getCsrf() { return document.cookie.match(/csrftoken=([^;]+)/)?.[1] ?? ''; }
  async function api(method, url, data) {
    return fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
      credentials: 'same-origin',
      body: data ? JSON.stringify(data) : undefined,
    });
  }

  let timerInterval;
  function startTimer() {
    let secs = 180;
    clearInterval(timerInterval);
    timer.textContent = '3:00';
    timerInterval = setInterval(() => {
      secs--;
      timer.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
      if (secs <= 0) { clearInterval(timerInterval); timer.textContent = '0:00'; }
    }, 1000);
  }

  async function sendCode() {
    emailErr.textContent = '';
    const res = await api('POST', '/api/users/email/send/', { email: email.value, purpose: 'RESET' });
    if (res.ok) {
      sendBtn.disabled = true;
      code.disabled = false;
      verifyBtn.disabled = false;
      startTimer();
    } else {
      const data = await res.json();
      emailErr.textContent = data.errors?.email ?? data.errors?.non_field_errors ?? '오류가 발생했습니다.';
    }
  }

  async function verifyCode() {
    codeErr.textContent = '';
    const res = await api('POST', '/api/users/email/verify/', { email: email.value, code: code.value, purpose: 'RESET' });
    if (res.ok) {
      clearInterval(timerInterval);
      code.disabled = true;
      verifyBtn.disabled = true;
      email.disabled = true;
      pw.disabled = false;
      pw2.disabled = false;
      resetBtn.disabled = false;
      timer.textContent = '✓';
    } else {
      const data = await res.json();
      codeErr.textContent = data.errors?.code ?? '인증코드가 일치하지 않습니다.';
    }
  }

  async function resetPw() {
    pwErr.textContent = '';
    pw2Err.textContent = '';
    const res = await api('POST', '/api/users/password/reset/', {
      email: email.value, password: pw.value, password_confirm: pw2.value,
    });
    if (res.ok) {
      alert('비밀번호가 변경되었습니다.');
      location.href = '/login/';
    } else {
      const data = await res.json();
      if (data.errors) {
        pwErr.textContent  = data.errors.password ?? '';
        pw2Err.textContent = data.errors.password_confirm ?? '';
      }
    }
  }
</script>
</body>
</html>
