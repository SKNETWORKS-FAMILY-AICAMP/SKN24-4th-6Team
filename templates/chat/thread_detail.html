{% extends "layout/base_chat.html" %}
{% block content %}

<div class="chat-header" id="chatTitle">로딩 중...</div>

<div id="messages" class="chat-box"></div>

<div class="chat-input-wrap">
  <div class="chat-input-box">
    <input type="text" id="content" placeholder="질문을 입력해주세요">
    <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>
  <p class="disclaimer">이 답변은 법적 조언이 아닌 단순 정보 제공 목적입니다. 반드시 전문가와 상담하세요</p>
</div>

{% endblock %}

{% block scripts %}
<script>
  const threadId = location.pathname.split('/').filter(Boolean).pop();

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="bubble">${text}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function load() {
    const res = await api('GET', `/chat/threads/${threadId}`);
    if (res.status === 401) { location.href = '/login/'; return; }
    const thread = await res.json();
    chatTitle.textContent = thread.title || '새 채팅';
    thread.messages.forEach(m => addMsg(m.role, m.content));

    // URL에 초기 질문이 있으면 자동 전송
    const q = new URLSearchParams(location.search).get('q');
    if (q) { content.value = q; sendMessage(); }
  }

  async function sendMessage() {
    const text = content.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    addMsg('user', text);
    content.value = '';
    const res = await api('POST', `/chat/threads/${threadId}/messages`, { content: text });
    if (res.ok) {
      addMsg('assistant', (await res.json()).content);
      loadSidebar(); // 사이드바 제목 갱신
    }
    sendBtn.disabled = false;
    content.focus();
  }

  content.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  load();
</script>
{% endblock %}
