{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이고청년</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="chat-body">

<aside class="sidebar">
  <div class="sidebar-logo">아이고 청년</div>
  <button class="sidebar-new-btn" onclick="newChat()">+ 새채팅</button>
  <p class="sidebar-label">최근 대화</p>
  <ul id="sidebarList" class="sidebar-list"></ul>
  <div class="sidebar-footer">
    <button onclick="doLogout()">로그아웃</button>
  </div>
</aside>

<main class="chat-main">
  {% block content %}{% endblock %}
</main>

<script>
  function getCsrf() { return document.cookie.match(/csrftoken=([^;]+)/)?.[1] ?? ''; }
  async function api(method, url, data) {
    return fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
      credentials: 'same-origin',
      body: data ? JSON.stringify(data) : undefined,
    });
  }
  async function newChat() {
    const res = await api('POST', '/chat/threads', { title: '' });
    if (res.ok) location.href = `/threads/${(await res.json()).id}/`;
  }
  async function doLogout() {
    if (!confirm('정말 로그아웃 하시겠어요?')) return;
    await api('POST', '/api/users/logout/');
    location.href = '/login/';
  }
  async function loadSidebar() {
    const res = await api('GET', '/chat/threads');
    if (res.status === 401) { location.href = '/login/'; return; }
    const threads = await res.json();
    const curId = location.pathname.split('/').filter(Boolean).pop();
    sidebarList.innerHTML = threads.length
      ? threads.map(t => `<li class="${String(t.id) === curId ? 'active' : ''}"><a href="/threads/${t.id}/">${t.title || '새 채팅'}</a></li>`).join('')
      : '<li class="sidebar-empty">대화 내역이 없습니다.</li>';
  }
  loadSidebar();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
