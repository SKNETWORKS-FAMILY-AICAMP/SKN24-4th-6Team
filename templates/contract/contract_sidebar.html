{% load static %}

<!-- 계약서 우측 사이드바 -->
<div class="contract-sidebar collapsed" id="contractSidebar">

  <!-- 책갈피 탭 버튼 (접힌 상태에서 튀어나옴) -->
  <button class="sidebar-tab" id="sidebarTab" onclick="openSidebar()" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <path d="M14 2v6h6"/>
    </svg>
  </button>

  <!-- X 닫기 버튼 (펼친 상태에서 표시) -->
  <button class="sidebar-close" id="sidebarClose" onclick="closeSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <!-- 계약서 없을 때 -->
  <div class="sidebar-empty" id="sidebarEmpty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
    </svg>
    <p>업로드된 계약서가 없습니다</p>
  </div>

  <!-- 계약서 있을 때 -->
  <div class="sidebar-content" id="sidebarContent" style="display:none">

    <!-- 계약서 정보 -->
    <section class="sidebar-section">
      <div class="section-header">
        <span class="section-title">계약서 정보</span>
      </div>
      <div class="contract-file-row">
        <div class="file-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
        </div>
        <span class="contract-file-name" id="contractFileName">-</span>
        <span class="contract-file-size" id="contractFileSize"></span>
      </div>
    </section>

    <div class="sidebar-divider"></div>

    <!-- 매물 정보 -->
    <section class="sidebar-section">
      <div class="section-header">
        <span class="section-title">매물 정보</span>
        <button class="btn-edit" id="propertyEditBtn" onclick="togglePropertyEdit()">수정</button>
      </div>

      <form class="info-box" id="propertyForm" onsubmit="savePropertyInfo(event)">
        <div class="info-row">
          <span class="info-label">소재지</span>
          <span class="info-value" id="viewLocation">-</span>
          <input class="info-input hidden" type="text" id="editLocation" placeholder="소재지 입력">
        </div>
        <div class="info-row">
          <span class="info-label">임대차 기간</span>
          <span class="info-value" id="viewPeriod">-</span>
          <div class="info-input-dates hidden" id="editPeriodWrap">
            <input class="info-input" type="date" id="editStartDate">
            <span class="info-input-sep">~</span>
            <input class="info-input" type="date" id="editEndDate">
          </div>
        </div>
        <div class="info-row">
          <span class="info-label">보증금</span>
          <span class="info-value" id="viewDeposit">-</span>
          <input class="info-input hidden" type="number" id="editDeposit" placeholder="0">
        </div>
        <div class="info-row">
          <span class="info-label">월세</span>
          <span class="info-value" id="viewMonthRent">-</span>
          <input class="info-input hidden" type="number" id="editMonthRent" placeholder="0">
        </div>
        <div class="info-row">
          <span class="info-label">관리비</span>
          <span class="info-value" id="viewHouseCost">-</span>
          <input class="info-input hidden" type="text" id="editHouseCost" placeholder="관리비 입력">
        </div>
      </form>
    </section>

    <div class="sidebar-divider"></div>

    <!-- 특약 정보 -->
    <section class="sidebar-section">
      <div class="section-header">
        <span class="section-title">특약 정보</span>
        <button class="btn-edit" id="specialEditBtn" onclick="toggleSpecialEdit()">수정</button>
      </div>

      <form class="special-box" id="specialForm" onsubmit="saveSpecialTerms(event)">
        <p class="special-text" id="viewSpecialTerms">-</p>
        <textarea
          class="special-textarea hidden"
          id="editSpecialTerms"
          placeholder="특약 내용을 입력하세요"
        ></textarea>
      </form>
    </section>

  </div>
</div>

<link rel="stylesheet" href="{% static 'css/contract/contract_sidebar.css' %}">
<script src="{% static 'js/contract/contract_sidebar.js' %}"></script>
