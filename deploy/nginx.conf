# aigo-server nginx vhost
#
# 위치: /etc/nginx/sites-available/aigo-server  (sites-enabled/ 로 심볼릭 링크)
# 도메인 발급 흐름:
#   1) 이 파일을 그대로 80 으로 띄우고 도메인 A 레코드 -> EC2 EIP 연결
#   2) `sudo certbot --nginx -d <도메인>` 실행
#      → certbot 이 이 파일을 자동 수정해 443 server block + 인증서 라인 추가
#      → 80 → 443 리다이렉트도 자동 추가
#   3) 발급 완료 후 .env 의 DJANGO_SECURE_SSL_REDIRECT=True 토글å

upstream aigo_gunicorn {
    server unix:/run/gunicorn/aigo.sock;
}

server {
    listen 80; # IPv4
    listen [::]:80; # IPv6
    server_name DOMAIN_PLACEHOLDER;

    # upload limit 
    client_max_body_size 25M;

    # serve static files directly by nginx
    location /static/ {
        alias /var/www/aigo-server/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/aigo-server/mediafiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://aigo_gunicorn;

        # pass client info to Django (for SECURE_PROXY_SSL_HEADER)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # timeouts (should be slightly larger than gunicorn timeout(130))
        proxy_connect_timeout 5s;
        proxy_read_timeout 140s;
        proxy_send_timeout 140s;

        proxy_redirect off;
        proxy_buffering on;
    }

    # gzip for static responses + JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
