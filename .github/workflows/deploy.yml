name: Deploy

on:
  # Test workflow 가 main 에서 success 로 끝났을 때만 배포
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # deploy 하다 push 때문에 끊기는 것 방지

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch 는 무조건, workflow_run 은 Test 가 success 일 때만
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH 로 EC2 접속 후 deploy.sh 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/aigo-server
            ./deploy/deploy.sh
