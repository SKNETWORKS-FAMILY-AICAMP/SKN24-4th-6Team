name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # deploy 하다 push 때문에 끊기는 것 방지

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 로 EC2 접속 후 deploy.sh 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true 
          script: |
            cd /var/www/aigo-server
            ./deploy/deploy.sh
