[project]
name = "aigo-web"
version = "0.1.0"
description = "aigo Django web/API server (companion to aigo-ai RAG chatbot)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.4",
    "django-environ>=0.12.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt[crypto]>=5.3.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "requests>=2.33.1",
    "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
extend-exclude = [
  "**/migrations/**",
  ".venv",
  "staticfiles",
  "mediafiles",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "UP", "DJ"]
ignore = [
  "S101",
  "S105",
  "S106",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/settings/**" = ["F403", "F405"]
"**/migrations/*.py" = ["E501", "DJ"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py", "*_test.py"]
testpaths = ["accounts", "chat", "health", "tests"]
pythonpath = ["."]
addopts = "-ra"
